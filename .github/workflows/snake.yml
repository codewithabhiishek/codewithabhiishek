name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300f0ff&color_dots=%23133a13,%231f5c1f,%2328801f,%2333b32e,%2339ff14&color_empty=%230a0a0a
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300f0ff&color_dots=%23133a13,%231f5c1f,%2328801f,%2333b32e,%2339ff14&color_empty=%230a0a0a

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
